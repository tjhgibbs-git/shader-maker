plugins { id 'net.fabricmc.fabric-loom' }
base { archivesName = 'shader-maker' }
allprojects { repositories { mavenCentral() } }
subprojects { group = rootProject.group; version = rootProject.version }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}
loom {
    splitEnvironmentSourceSets()
    mods { 'shader-maker' { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
def scraperProject = findProject(':block-scraper-mod')
if (scraperProject != null) {
    sourceSets { scraper { compileClasspath += sourceSets.client.output + sourceSets.main.output + sourceSets.client.compileClasspath; runtimeClasspath += output + compileClasspath } }
    dependencies { scraperImplementation scraperProject; localRuntime scraperProject }
    loom { mods { 'shader-maker-scraper' { sourceSet sourceSets.scraper }; 'block-scraper' { sourceSet 'main', scraperProject } } }
    apply from: new File(scraperProject.projectDir.parentFile, 'gradle/block-scraper.gradle')
    tasks.matching { it.name == 'runBlockScraper' }.configureEach { dependsOn 'scraperClasses'; classpath += sourceSets.scraper.output }
}
tasks.register('referenceTest', JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = 'io.github.tjhgibbs.shadermaker.ProjectTest' }
tasks.register('atmosphereTest', JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = 'io.github.tjhgibbs.shadermaker.AtmosphereTest' }
tasks.register('curvesTest', JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = 'io.github.tjhgibbs.shadermaker.CurvesTest' }
check.dependsOn 'referenceTest', 'atmosphereTest', 'curvesTest'

sourceSets {
    clientTest {
        compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.client.runtimeClasspath
    }
}
tasks.register('minecraftContractTest', JavaExec) {
    dependsOn clientTestClasses
    classpath = sourceSets.clientTest.runtimeClasspath
    mainClass = 'io.github.tjhgibbs.shadermaker.MinecraftContractTest'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
check.dependsOn 'minecraftContractTest'
tasks.named('test') { failOnNoDiscoveredTests = false }

tasks.register('worldContextTest', JavaExec) {
    dependsOn clientTestClasses
    classpath = sourceSets.clientTest.runtimeClasspath
    mainClass = 'io.github.tjhgibbs.shadermaker.client.WorldContextTest'
}
check.dependsOn 'worldContextTest'

tasks.register('sampleImageTest', JavaExec) {
    dependsOn clientTestClasses
    classpath = sourceSets.clientTest.runtimeClasspath
    mainClass = 'io.github.tjhgibbs.shadermaker.client.SampleImageTest'
}
check.dependsOn 'sampleImageTest'

tasks.register('fogTest', JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = 'io.github.tjhgibbs.shadermaker.FogTest' }
check.dependsOn 'fogTest'

tasks.register('worldSignalsTest', JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = 'io.github.tjhgibbs.shadermaker.WorldSignalsTest' }
check.dependsOn 'worldSignalsTest'
tasks.register('commandLayersTest', JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = 'io.github.tjhgibbs.shadermaker.CommandLayersTest' }
check.dependsOn 'commandLayersTest'
